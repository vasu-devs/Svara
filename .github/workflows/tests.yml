name: Tests

on:
  push:
    branches: [main]
    paths: ["mywhisper/**", "tests/**", "web/**", "app_entry.py", "MyWhisper.spec", "config.yaml", "requirements.txt", "setup.bat", ".github/workflows/tests.yml"]
  pull_request:
    paths: ["mywhisper/**", "tests/**", "web/**", "app_entry.py", "MyWhisper.spec", "config.yaml", "requirements.txt", "setup.bat", ".github/workflows/tests.yml"]

jobs:
  website:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        static-export: ["0", "1"]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          GH_PAGES: ${{ matrix.static-export }}

  unit:
    # windows-latest on purpose: the install/autostart tests exercise the real
    # registry (HKCU, throwaway value names) and Windows path semantics.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Only what the unit-tested modules import — the heavy STT stack
      # (faster-whisper/CUDA/sounddevice) is deliberately not exercised here.
      # numpy is needed because bench.py and the live-path test import it at
      # module level; test_livepath itself skips without faster-whisper.
      # sounddevice is needed because app.py imports audio.py at module level,
      # so test_app_smoke cannot even import the app without it. The wheel
      # bundles PortAudio and importing it does not require an audio device;
      # the tests mock Recorder anyway.
      # Keep this in sync with what the unit-tested modules import at module
      # level. Twice now a new test has gone red here only because a transitive
      # dependency the dev venv already had was missing on the runner, so each
      # entry says which module needs it:
      #   pyyaml       config, dictionary_io
      #   pynput       quickkeys
      #   numpy        bench, test_livepath
      #   sounddevice  audio (imported by app.py at module level)
      #   tqdm         setup_ui's download-progress shim
      - name: Install test dependencies
        run: pip install pyyaml pynput numpy sounddevice tqdm comtypes
      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      # Called out separately so a failure reads as what it actually is —
      # dictated text reaching the log file — instead of "a test broke".
      - name: Privacy guarantee — no transcript reaches the log
        run: python -m unittest tests.test_redact -v

      # config.yaml is the documentation users actually read, so a key
      # documented there but absent from DEFAULTS is a promise the code does
      # not keep. tests/test_config_integrity.py checks both directions.
      - name: Config integrity
        run: python -m unittest tests.test_config_integrity -v
