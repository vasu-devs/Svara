<!--
  The Svara mark: flowing strings on a dark rounded square.

  This is the SAME mark the desktop app carries (assets/icon.ico, embedded in
  Svara.exe and inherited by the Start Menu shortcut), so the icon a user sees
  in a browser tab is the icon they see in Windows Search and on the taskbar.

  It previously used neon pink, cyan and violet from an earlier identity, which
  matched nothing else the product ships: the app, the setup window and this
  site are all warm ink-on-paper with a single sienna accent. One product, one
  mark.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <filter id="glow" x="-30%" y="-60%" width="160%" height="220%">
      <feGaussianBlur stdDeviation="1.4"/>
    </filter>
  </defs>

  <!-- Warm near-black, matching the app icon's tile rather than pure #000 -->
  <rect width="64" height="64" rx="14" fill="#2e2822"/>

  <g fill="none" stroke-linecap="round">
    <!-- Soft bloom underneath, so the strings read as lit rather than drawn -->
    <g filter="url(#glow)" stroke-width="3.4" opacity="0.55">
      <path d="M6 32 q9 -12 18 0 t18 0 t16 0" stroke="#c1573a"/>
      <path d="M6 32 q9 12 18 0 t18 0 t16 0" stroke="#e08a5e"/>
      <path d="M6 32 q9 -7 18 0 t18 0 t16 0" stroke="#d0693f"/>
    </g>
    <!-- Crisp strings on top -->
    <g stroke-width="1.7">
      <path d="M6 32 q9 -12 18 0 t18 0 t16 0" stroke="#e8a33d" opacity="0.9"/>
      <path d="M6 32 q9 12 18 0 t18 0 t16 0" stroke="#f0a878"/>
      <path d="M6 32 q9 -7 18 0 t18 0 t16 0" stroke="#c1573a"/>
    </g>
  </g>
</svg>
